apiVersion: apps/v1
kind: Deployment
metadata:
  name: algorave-live
  labels:
    app: algorave-live
  annotations:
    keel.sh/policy: "force"  # Use "force" or "minor" depending on your update policy
    keel.sh/trigger: "poll"  # Track image updates
    keel.sh/pollSchedule: "@every 30s"
spec:
  replicas: 1  # Adjust according to your scaling needs
  selector:
    matchLabels:
      app: algorave-live
  template:
    metadata:
      labels:
        app: algorave-live
    spec:
      containers:
        - name: algorave-vdo-ninja # Added container name
          image: yassinsiouda/algorave-vdo-ninja:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "800m"

---
apiVersion: v1
kind: Service
metadata:
  name: algorave-live
spec:
  selector:
    app: algorave-live
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: algorave-live
spec:
  rules:
  - host: mydomain.club
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: algorave-live
              port:
                number: 80